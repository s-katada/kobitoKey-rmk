[keyboard]
name = "KobitoKey"
product_name = "KobitoKey"
vendor_id = 0x4B4B
product_id = 0x0001
manufacturer = "KobitoKey"
serial_number = "vial:f64c2b3c:000001"
chip = "nrf52840"

# --------------------------------------------------
# RMK 全体設定
#   ble_profiles_num=5 で ZMK の BT_SEL 0..4 に対応
#   combo_max_num=16 (ZMK の combos と同数)
# --------------------------------------------------
[rmk]
split_peripherals_num = 1
# ZMK の bt BT_SEL 0..4 を保持するため 5。kobu は 4 だが KobitoKey 側は ZMK 互換を優先。
ble_profiles_num = 5
combo_max_num = 16
morse_max_num = 8
macro_space_size = 256
fork_max_num = 8

# --------------------------------------------------
# Layout: 4 rows x 10 cols, 7 layers
# --------------------------------------------------
# ZMK Behavior 対応一覧
#   ht_cmd_shift_colon  → TD(0)/TD(1)  (fork で Shift 状態に応じて切替)
#   ht_ctrl_shift_colon → TD(2)/TD(3)
#   mt LSHFT LG(LBKT)   → TD(4)        (hold=Shift, tap=Cmd+[)
#   td_home_ctla        → TD(5)        (tap=Home, double=Ctrl+A)
#   td_kill_line        → TD(6)        (tap=Ctrl+K, double=Macro0=kill_line)
#   ht_cmd_ctrl_qmark   → MT(Slash, LGui|LCtrl)   (`/`/`?` は自然反転で OK)
#   ht_ctrl_alt_qmark   → MT(Slash, LCtrl|LAlt)
#   bt BT_SEL N         → User(N)
#   bt BT_CLR           → User(7) (ClearProfile)
#
# `;` キーの mod-morph 完全再現 (ZMK colon_semi):
#   - 通常時:   morse[0].tap = WM(Semicolon, LShift)  →  `:`
#   - 通常時:   morse[0].hold = WM(No, LGui|LShift)   →  Cmd+Shift
#   - Shift時:  fork → morse[1] へ差し替え + Shift 抑制
#                morse[1].tap = Semicolon (Shift 抑制中)  →  `;`
#                morse[1].hold = WM(No, LGui|LShift)      →  Cmd+Shift
#   Win 用 Layer 1 (1,9) は morse[2]/[3] で同様に Ctrl+Shift hold。
# --------------------------------------------------
[layout]
rows = 4
cols = 10
layers = 7
keymap = [
    # Layer 0: Default (Mac QWERTY)
    [
        ["Q",  "W",  "E",  "R",  "T",         "Y",  "U",  "I",  "O",  "P"],
        ["A",  "S",  "D",  "F",  "G",         "H",  "J",  "K",  "L",  "TD(0)"],
        ["Z",  "X",  "C",  "V",  "B",         "N",  "M",  "Comma", "Dot", "MT(Slash, LGui | LCtrl)"],
        ["No", "No", "MT(Backspace, LGui)", "LCtrl", "MT(Language2, LShift)",
                                             "MT(Escape, LAlt)", "LT(2, Space)", "LT(3, Enter)", "No", "No"],
    ],
    # Layer 1: Win/Linux overlay (差分のみ)
    [
        ["_",  "_",  "_",  "_",  "_",         "_",  "_",  "_",  "_",  "_"],
        ["_",  "_",  "_",  "_",  "_",         "_",  "_",  "_",  "_",  "TD(2)"],
        ["_",  "_",  "_",  "_",  "_",         "_",  "_",  "_",  "_",  "MT(Slash, LCtrl | LAlt)"],
        ["_",  "_",  "MT(Backspace, LAlt)", "LT(5, LGui)", "_",
                                             "MT(Escape, LGui)", "_", "_", "_", "_"],
    ],
    # Layer 2: Numbers & Symbols
    [
        ["Kc1", "Kc2", "Kc3", "Kc4", "Kc5",   "Kc6", "Kc7", "Kc8", "Kc9", "Kc0"],
        ["WM(Kc1, LShift)", "WM(Kc2, LShift)", "WM(Kc3, LShift)", "WM(Kc4, LShift)", "WM(Kc5, LShift)",
                                             "Left", "Down", "Up",  "Right", "_"],
        ["WM(Kc6, LShift)", "WM(Kc7, LShift)", "WM(Kc8, LShift)", "WM(Kc9, LShift)", "WM(Kc0, LShift)",
                                             "No",   "No",   "No",  "No",    "_"],
        ["_",  "_",  "_",  "_",  "MT(Language1, LShift)",
                                             "_",  "_",  "_",  "_",  "_"],
    ],
    # Layer 3: Settings & Media
    [
        ["User0", "User1", "User2", "User3", "User4",
                                             "MediaPrevTrack", "MediaPlayPause", "MediaNextTrack", "AudioVolDown", "AudioVolUp"],
        ["F1", "F2", "F3", "F4", "F5",       "F6", "F7", "F8", "F9", "F10"],
        ["TO(0)", "TG(1)", "No", "No", "User7",
                                             "F11", "F12", "F13", "No", "_"],
        ["_",  "_",  "_",  "_",  "_",        "Delete", "_", "_", "_", "_"],
    ],
    # Layer 4: Mac shortcut / mouse buttons
    [
        ["WM(LeftBracket, LGui | LShift)", "WM(RightBracket, LGui | LShift)", "No", "No", "No",
                                             "MouseBtn1", "MouseBtn2", "MouseBtn2", "MouseBtn3", "_"],
        ["TD(4)", "WM(RightBracket, LGui)", "No", "No", "No",
                                             "No", "No", "No", "No", "_"],
        ["LCtrl", "No", "WM(C, LGui)", "WM(V, LGui)", "No",
                                             "No", "No", "No", "No", "_"],
        ["_",  "_",  "_",  "_",  "_",        "_",  "_",  "_",  "_",  "_"],
    ],
    # Layer 5: Emacs (Win 用 Ctrl コンビ)
    [
        ["WM(Q, LCtrl)", "WM(W, LCtrl)", "End", "WM(R, LCtrl)", "WM(T, LCtrl)",
                                             "WM(Y, LCtrl)", "WM(U, LCtrl)", "WM(I, LCtrl)", "WM(O, LCtrl)", "Up"],
        ["TD(5)", "WM(S, LCtrl)", "Delete", "Right", "WM(G, LCtrl)",
                                             "Backspace", "WM(J, LCtrl)", "TD(6)", "WM(L, LCtrl)", "WM(Semicolon, LCtrl)"],
        ["WM(Z, LCtrl)", "WM(X, LCtrl)", "WM(C, LCtrl)", "WM(V, LCtrl)", "Left",
                                             "Down", "WM(M, LCtrl)", "WM(Comma, LCtrl)", "WM(Dot, LCtrl)", "WM(Quote, LCtrl)"],
        ["_",  "_",  "_",  "_",  "_",        "_",  "_",  "_",  "_",  "_"],
    ],
    # Layer 6: Neovim (Ctrl を抑制 → Emacs を無効化)
    [
        ["_",  "_",  "_",  "_",  "_",        "_",  "_",  "_",  "_",  "_"],
        ["_",  "_",  "_",  "_",  "_",        "_",  "_",  "_",  "_",  "_"],
        ["_",  "_",  "_",  "_",  "_",        "_",  "_",  "_",  "_",  "_"],
        ["_",  "_",  "_",  "LCtrl", "_",     "_",  "_",  "_",  "_",  "_"],
    ],
]

# --------------------------------------------------
# Combos (ZMK 移植)
# --------------------------------------------------
[behavior.combo]
timeout = "50ms"
combos = [
  # 左手
  { actions = ["Q", "W"],         output = "Grave" },            # ` / ~
  { actions = ["A", "S"],         output = "Tab" },

  # 右手
  { actions = ["Y", "U"],         output = "Backspace" },
  { actions = ["U", "I"],         output = "Backslash" },        # \ / | (fork 反転)
  { actions = ["I", "O"],         output = "Minus" },            # - / _
  { actions = ["O", "P"],         output = "Equal" },            # = / +
  { actions = ["J", "K"],         output = "LeftBracket" },      # [ / {
  { actions = ["K", "L"],         output = "RightBracket" },     # ] / }
  { actions = ["L", "Semicolon"], output = "Quote" },            # ' / "
  { actions = ["N", "M"],         output = "Backspace" },
  { actions = ["Comma", "Dot"],   output = "Slash" },            # / / ?

  # モディファイア
  { actions = ["D", "F"],         output = "WM(No, LGui | LAlt)",  layer = 0 },  # Mac: Cmd+Alt
  { actions = ["D", "F"],         output = "WM(No, LCtrl | LAlt)", layer = 1 },  # Win: Ctrl+Alt

  # Neovim トグル
  { actions = ["S", "D"],         output = "TG(6)", layer = 1 },
  { actions = ["S", "D"],         output = "TG(6)", layer = 6 },
]

# --------------------------------------------------
# Fork
#   1) U+I コンボの Backslash 反転 (`|` ↔ `\`)
#   2-3) TD(0)/TD(2) の `;` mod-morph 反転 (Shift 押下時 TD(1)/TD(3) へ差替)
# --------------------------------------------------
[behavior.fork]
forks = [
  # U+I コンボの Backslash:
  #   通常 `|` (Shift+\) / Shift 押下時 `\` (Shift 抑制)
  { trigger = "Backslash",
    negative_output = "WM(Backslash, LShift)",
    positive_output = "Backslash",
    match_any = "LShift|RShift" },

  # Layer 0 (1,9) ht_cmd_shift_colon: Shift で TD(1) へ差替 (Shift 抑制)
  { trigger = "TD(0)",
    negative_output = "TD(0)",
    positive_output = "TD(1)",
    match_any = "LShift|RShift" },

  # Layer 1 (1,9) ht_ctrl_shift_colon: Shift で TD(3) へ差替 (Shift 抑制)
  { trigger = "TD(2)",
    negative_output = "TD(2)",
    positive_output = "TD(3)",
    match_any = "LShift|RShift" },
]

# --------------------------------------------------
# Morse (ホールドタップ / タップダンス)
#
#   morse[0]: Layer 0 `;` 通常時  → tap=`:`  / hold=Cmd+Shift
#   morse[1]: Layer 0 `;` Shift時 → tap=`;` (Shift抑制) / hold=Cmd+Shift
#   morse[2]: Layer 1 `;` 通常時  → tap=`:`  / hold=Ctrl+Shift
#   morse[3]: Layer 1 `;` Shift時 → tap=`;` (Shift抑制) / hold=Ctrl+Shift
#   morse[4]: Layer 4 (1,0) MT     → tap=Cmd+[ / hold=Shift
#   morse[5]: Layer 5 td_home_ctla → tap=Home / double=Ctrl+A
#   morse[6]: Layer 5 td_kill_line → tap=Ctrl+K / double=Macro0
# --------------------------------------------------
[behavior.morse]
hold_timeout = "200ms"
gap_timeout = "200ms"

# morse[0]: ht_cmd_shift_colon (default = `:`)
[[behavior.morse.morses]]
tap = "WM(Semicolon, LShift)"
hold = "WM(No, LGui | LShift)"

# morse[1]: ht_cmd_shift_colon (shifted = `;`, shift は fork が抑制済み)
[[behavior.morse.morses]]
tap = "Semicolon"
hold = "WM(No, LGui | LShift)"

# morse[2]: ht_ctrl_shift_colon (default = `:`)
[[behavior.morse.morses]]
tap = "WM(Semicolon, LShift)"
hold = "WM(No, LCtrl | LShift)"

# morse[3]: ht_ctrl_shift_colon (shifted = `;`)
[[behavior.morse.morses]]
tap = "Semicolon"
hold = "WM(No, LCtrl | LShift)"

# morse[4]: mt LSHFT LG(LBKT)
[[behavior.morse.morses]]
tap = "WM(LeftBracket, LGui)"
hold = "LShift"

# morse[5]: td_home_ctla
[[behavior.morse.morses]]
tap = "Home"
double_tap = "WM(A, LCtrl)"

# morse[6]: td_kill_line
[[behavior.morse.morses]]
tap = "WM(K, LCtrl)"
double_tap = "Macro0"

# --------------------------------------------------
# Macros
#   macro0: macro_kill_line = Shift+End → Delete
# --------------------------------------------------
[behavior.macros]

[[behavior.macros.macros]]
operations = [
  { operation = "down", keycode = "LShift" },
  { operation = "tap",  keycode = "End" },
  { operation = "up",   keycode = "LShift" },
  { operation = "tap",  keycode = "Delete" },
]

# --------------------------------------------------
# Host / Vial
#   Vial 編集の unlock chord は両手の外側 pinky (Q + P) を同時押し。
#   matrix 位置で固定なので Vial 上で Q/P を別物に置換しても unlock は無効化されない。
# --------------------------------------------------
[host]
vial_enabled = true
unlock_keys = [[0, 0], [0, 9]]

# --------------------------------------------------
# Storage
#   RMK 0.8 nrf52840 default は 0xA0000..0xC0000 (128KiB) だが、
#   upstream の default 変化に追従されないように明示。
# --------------------------------------------------
[storage]
enabled = true
start_addr = 0xA0000
num_sectors = 32
clear_layout = false
clear_storage = false

# --------------------------------------------------
# BLE
#   battery_adc_pin: XIAO nRF52840 BLE 内蔵分圧 (R10=1MΩ / R11=510kΩ).
#     ratio = 510 / 1510 ≈ 0.338 — 1/2 にすると 4.0V LiPo が 2.7V と
#     decode され 0% 表示になる罠を回避。
#   default_tx_power = 8: nRF52840 max。Mac 系の検出距離を底上げ。
#
#   [[split.*.output]] で P0_14 を Low 持続にしないと分圧パスが切れて
#   P0_31 へ電圧が乗らない。Section は下の split.* を参照。
# --------------------------------------------------
[ble]
enabled = true
default_tx_power = 8
battery_adc_pin = "P0_31"
adc_divider_measured = 510
adc_divider_total = 1510

# --------------------------------------------------
# Chip — nrf52840
#   XIAO は LiPo 駆動。DCDC reg0/reg1 を有効化しないと BLE が弱まり
#   macOS Bluetooth で見えないことがある (kobu 由来の知見)。
# --------------------------------------------------
[chip.nrf52840]
dcdc_reg0 = true
dcdc_reg1 = true
dcdc_reg0_voltage = "3V3"

# --------------------------------------------------
# Split keyboard
# --------------------------------------------------
[split]
connection = "ble"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]

[split.central.matrix]
matrix_type = "normal"
# diode-direction = col2row (RMK default)
# row-gpios: D1, D2, D3, D6  →  XIAO BLE 物理ピン
#   D1 = P0_03, D2 = P0_28, D3 = P0_29, D6 = P1_11
# col-gpios: D10, D9, D8, D7, gpio0 P0_10
#   D10 = P1_15, D9 = P1_14, D8 = P1_13, D7 = P1_12, gpio0[10] = P0_10
row_pins = ["P0_03", "P0_28", "P0_29", "P1_11"]
col_pins = ["P1_15", "P1_14", "P1_13", "P1_12", "P0_10"]

# Battery sense enable: P0_14 を LOW 持続にしないと P0_31 へ分圧電圧が乗らない。
# low_active=false + initial_state_active=false で boot 時 Level::Low に保持。
[[split.central.output]]
pin = "P0_14"
low_active = false
initial_state_active = false

# 左トラックボール (central 側)
[[split.central.input_device.pmw3610]]
name = "left"
spi.instance = "bitbang0"
spi.sck = "P0_05"
spi.mosi = "P0_04"
spi.miso = "P0_04"
spi.cs = "P0_09"
motion = "P0_02"
cpi = 700
invert_x = true
smart_mode = true
force_awake = true

# --------------------------------------------------
# Peripheral (right half)
# --------------------------------------------------
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_03", "P0_28", "P0_29", "P1_11"]
col_pins = ["P1_15", "P1_14", "P1_13", "P1_12", "P0_10"]

# Battery sense enable for peripheral half (central と同じ)。
[[split.peripheral.output]]
pin = "P0_14"
low_active = false
initial_state_active = false

# 右トラックボール (peripheral 側)
[[split.peripheral.input_device.pmw3610]]
name = "right"
spi.instance = "bitbang0"
spi.sck = "P0_05"
spi.mosi = "P0_04"
spi.miso = "P0_04"
spi.cs = "P0_09"
motion = "P0_02"
cpi = 800
smart_mode = true
force_awake = true
