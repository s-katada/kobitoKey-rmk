# cargo-make tasks for KobitoKey RMK firmware.
#
# 主要なタスク:
#   cargo make uf2           # central + peripheral の UF2 を生成
#   cargo make uf2-reset     # reset firmware の UF2 を生成
#   cargo make uf2-all       # 上記すべて
#
# nix develop シェル内で実行することを想定。

[tasks.install-llvm-tools]
install_crate = { rustup_component_name = "llvm-tools" }

[tasks.flip-link]
install_crate = { crate_name = "flip-link", binary = "flip-link", test_arg = ["-h"] }

# --- central ---
[tasks.objcopy-central]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = ["objcopy", "--help"] }
command = "cargo"
args = ["objcopy", "--release", "--bin", "central", "--", "-O", "ihex", "rmk-central.hex"]
dependencies = ["install-llvm-tools", "flip-link"]

[tasks.uf2-central]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = ["hex-to-uf2", "--help"] }
command = "cargo"
args = ["hex-to-uf2", "--input-path", "rmk-central.hex", "--output-path", "rmk-central.uf2", "--family", "nrf52840"]
dependencies = ["objcopy-central"]

# --- peripheral ---
[tasks.objcopy-peripheral]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = ["objcopy", "--help"] }
command = "cargo"
args = ["objcopy", "--release", "--bin", "peripheral", "--", "-O", "ihex", "rmk-peripheral.hex"]
dependencies = ["install-llvm-tools", "flip-link"]

[tasks.uf2-peripheral]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = ["hex-to-uf2", "--help"] }
command = "cargo"
args = ["hex-to-uf2", "--input-path", "rmk-peripheral.hex", "--output-path", "rmk-peripheral.uf2", "--family", "nrf52840"]
dependencies = ["objcopy-peripheral"]

# --- reset ---
[tasks.objcopy-reset]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = ["objcopy", "--help"] }
command = "cargo"
args = ["objcopy", "--release", "--manifest-path", "reset/Cargo.toml", "--", "-O", "ihex", "rmk-reset.hex"]
dependencies = ["install-llvm-tools"]

[tasks.uf2-reset]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = ["hex-to-uf2", "--help"] }
command = "cargo"
args = ["hex-to-uf2", "--input-path", "rmk-reset.hex", "--output-path", "rmk-reset.uf2", "--family", "nrf52840"]
dependencies = ["objcopy-reset"]

# --- bundle ---
[tasks.uf2]
dependencies = ["uf2-central", "uf2-peripheral"]

[tasks.uf2-all]
dependencies = ["uf2-central", "uf2-peripheral", "uf2-reset"]
